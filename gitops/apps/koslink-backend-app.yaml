apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: koslink-backend-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/koscom-team01/kosops.git'
    targetRevision: HEAD
    path: gitops/charts/generic-app
    helm:
      values: |
        replicaCount: 0
        image:
          repository: harbor.hwangonjang.com/library/koslink-backend
          tag: 7
          pullPolicy: Always
        service:
          type: ClusterIP
          port: 8080
        ingress:
          enabled: true
          className: nginx
          annotations:
            ingress.kubernetes.io/ssl-redirect: "false"
            nginx.ingress.kubernetes.io/ssl-redirect: "false"
          hosts:
            - host: koslink-api.hwangonjang.com
              paths:
                - path: /
                  pathType: Prefix
        envFrom:
          - secretRef:
              name: koslink-backend-secret
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: koslink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
