apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: koslink-ai-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/koscom-team01/kosops.git'
    targetRevision: HEAD
    path: gitops/charts/generic-app
    helm:
      values: |
        replicaCount: 1
        image:
          repository: harbor.hwangonjang.com/library/koslink-ai
          tag: 25
          pullPolicy: Always
        service:
          type: ClusterIP
          port: 8000
        ingress:
          enabled: true
          className: nginx
          annotations:
            ingress.kubernetes.io/ssl-redirect: "false"
            nginx.ingress.kubernetes.io/ssl-redirect: "false"
          hosts:
            - host: koslink-ai.hwangonjang.com
              paths:
                - path: /
                  pathType: Prefix
        env:
          - name: PG_CONNECTION_STRING
            value: "postgresql+psycopg://admin:adminpassword@postgresql.database.svc.cluster.local:5432/koscomdb"
          - name: NEO4J_URI
            value: "bolt://neo4j.neo4j.svc.cluster.local:7687"
          - name: NEO4J_USER
            value: "neo4j"
          - name: NEO4J_PASSWORD
            value: "neo4jpassword"
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: koslink-ai-secret
                key: OPENAI_API_KEY
          - name: DART_API_KEY
            valueFrom:
              secretKeyRef:
                name: koslink-ai-secret
                key: DART_API_KEY
          - name: DART_CACHE_DIR
            value: ".cache/dart"
          - name: EMBEDDING_PROVIDER
            value: "openai"
          - name: EMBEDDING_MODEL_KURE
            value: "nlpai-lab/KURE-v1"
          - name: EMBEDDING_MODEL_BGE_M3
            value: "BAAI/bge-m3"
          - name: EMBEDDING_DEVICE
            value: "cpu"
          - name: VECTOR_COLLECTION_NAME
            value: "market_evidence"
          - name: PORT
            value: "8000"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: koslink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
